# project_contract.yaml — 全项目合同 / 官方核验台账（人类编辑，非运行时配置）
#
# 用途：把「官方已明确」「本地实现现状」「仍待公司内网官方接口核验」三件事分开登记，
#       供 Codex/维护者审核与派单时查阅。它**不是**运行时配置：
#       runtime_loading: false —— 当前没有任何代码读取本文件，也不要求将来读取。
#       本文件不改变官方规则、不改变本地行为，只是可核对的台账。
#
# 必读约定：
#   priority         P0 = 影响官方符合性判定；P1 = 协议/观测核验缺口；P2 = 低影响澄清
#   category         ambiguity=官方未说清；assumption=本地假设；source_conflict=两份官方材料冲突；
#                    implementation_gap=官方明确但本地未实现；noncompliant_approximation=官方明确而本地近似实现
#                    （五类分开登记，不混用；"未实现"不得写成"可选/未规定"）
#   status           pending_official=等公司内网官方接口/回放核验；needs_trace=需真实回归证据；
#                    confirmed=已核验（必须填 confirmation）；recheck_source=官方材料更新后需复核
#   confirmation     null = 未确认。**任何非 null 值都必须附来源与证据**（官方平台版本 + 回放/截图/原文节号）。
#                    禁止用本地模拟、审计通过或示例代码当作官方确认。
#   evidence_needed  只写"最小证据"：一次请求-响应-再请求三元组、或一张可读截图、或官方一句话补充；
#                    不要求公司原始文件、日志、账号或任何凭据。
#
# 安全：本文件与配套指南不得写入密钥、令牌、内网地址、账号、公司原始数据。
# 日期：2026-09-14 编制。

