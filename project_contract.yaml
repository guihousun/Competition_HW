verification_items:
  # ---------------- P0：直接影响官方符合性 ----------------
  - id: V-001
    title: 固定刷新点的确切坐标、批次落位与被占格处理
    priority: P0
    category: assumption
    status: pending_official
    official:
      requirement: "固定刷新点为用户来源的开发约束（RULE_SUPPLEMENTS S03，关联任务书 §4.7.3）；Issue12 给出方向（蓝方基地右侧、约距右边界 1/3 地图）。任务书只说夜晚第一回合统一出现、数量随天数增加，未给坐标"
      refs: [user_supplements, taskbook, issue12]
    local:
      behavior: "已实现固定列阵刷新池：临基地进攻侧首列 x≈27（蓝方，向右）或 x≈13（红方镜像，向左），每列至多 9 个纵向位置（高度≥9 时平移纵向带保持 9 格），整场复用、不四面随机；池容量≥106（可到边界）。高级怪（boss/大型/中型/小型）近到远占位，召唤附加怪并入同一排序；占用时跳过固定槽并报告短缺，不向池外扩散；调用方 spawn_points 按原顺序保留并标为自定义几何；layout 记录 ownerTeam，双队各自持有自己的池。精确格子、纵向中心、红方镜像与占格处理仍是本地几何假设"
      code: "scenarios.configure_spawns / spawn_column_pool / spawn_row_band；match.TwoTeamMatch._ensure_spawn_layout（按 ownerTeam 隔离）；scenarios.prepare_round"
    question: "固定点的确切坐标有哪些（每侧、是否随地图变化）？一批多只机器人按什么顺序/规则落到这些点？某点被建筑、角色或中立单位占据时，该批机器人落在哪里或是否延后？"
    evidence_needed: "官方带坐标的刷怪点示意，或连续两夜同一地图的请求快照（同坐标重复出现，且能看到被占格时的处理）"
    confirmation: null

  - id: V-002
    title: 任务点2的两格朝向与编码，以及它与"周围一格接取/阻挡移动"的关系
    priority: P0
    category: ambiguity
    status: pending_official
    official:
      requirement: "任务书 §4.6.2：任务点2占据两格，开拓者处于任一格即可领取任务；任务点属于阻挡移动的元素（§4.1）；领取范围为'周围一格内'（§4.4 acceptTask）"
      refs: [taskbook, request_sample]
    local:
      behavior: "初始地图只登记一个 zone 格，第二格由 taskworld.point_cells 按硬编码推导为 (x+1, y)（示例 request.txt 的两格为 (16,17)+(17,17)，与该推导一致但只是本地约定）；playerTasks[].taskPosition 只给一个锚点。**两格本身是官方明确的**，这里要核的是编码与朝向"
      code: "scenarios.scenario（每个任务点只 pop 一个格）；taskworld.point_cells；protocol.Turn.zones/occupied_cells"
    question: "锚点格与第二格的相对朝向（横向/纵向、锚点是否总为靠西/靠北一格）如何确定？playerTasks[].taskPosition 是锚点还是仅其中一格？对两格各自的'周围一格'圈，取并集还是分别判定？"
    evidence_needed: "两张不同地图的请求片段，显示两格坐标差、taskPosition 与（若有）合法领取位置"
    confirmation: null

  - id: V-003
    title: 建造区域（蓝/黄）的确切几何与坐标锚定
    priority: P0
    category: assumption
    status: pending_official
    official:
      requirement: "任务书 §4.1：蓝色区域只能造武器、黄色区域只能造墙；基地位置由系统指定；请求未提供区域字段（接口文档 §1.2 只有 zones/neutralType）"
      refs: [taskbook, api_doc]
    local:
      behavior: "以基地 2×2 占地为基准，切比雪夫半径 1 视为可造武器、半径 2 视为可造墙（一圈炮两圈墙）；不匹配时按指令执行失败处理"
      code: "simulator.step build 分支（radius = min(distance(target,p) for p in station_footprint)）"
    question: "可用建造区的形状与边界坐标是什么？是否随地图变化？以基地左上角还是中心锚定？允许区域是整片矩形还是环绕基地区域？"
    evidence_needed: "官方可读建造区示意图（含坐标轴刻度）或一段带合法/非法建造结果的回放"
    confirmation: null

  - id: V-004
    title: 机器人基础波次的数量增长公式与类型比例
    priority: P0
    category: assumption
    status: pending_official
    official:
      requirement: "任务书 §4.7.3：数量随天数增加；召唤令叠加在基础浪潮之上；具体公式与类型比例未给出"
      refs: [taskbook]
    local:
      behavior: "默认 `observed-seven-days`：第1–7天用 Issue19 附件 default.xlsx Sheet1 B2:H5 的实测数量（合计 35/45/58/69/75/86/91，空白类型运行时按0解释）；第8–10天附件为空，本地续演假设在 day7 基础上每夜多 5 只小型（96/101/106），元数据 observed=false/source_day=7/extrapolation=true、raw_counts 保持 null、day7 起点另存 seed_counts_day7。可选 `local-pressure` 保留旧实验 day×pressure+1（压力为本地参数1–3）；pressure 只影响该实验。类型排序 boss/大型/中型/小型 近到远，召唤附加怪并入同一排序"
      code: "wave_data.py（OBSERVED_TYPES/ISSUE19_SOURCE/wave_plan）；scenarios.prepare_round（profile=observed-seven-days/local-pressure）"
    question: "官方每夜的基础数量公式是什么？各类型（小/中/大/BOSS）的构成比例与出现起始夜是什么？上限如何？第8–10天的官方数量是多少？"
    evidence_needed: "多夜请求快照中 robot.roles 的类型与数量，或官方一句话公式说明；第8–10天的坐标数量"
    confirmation: null

  - id: V-005
    title: 响应包的完整契约：必需字段、空值形状与枚举拼写
    priority: P0
    category: ambiguity
    status: pending_official
    official:
      requirement: "接口文档 §2.1 把 roleCommandMap/prompt/executeCmd 列为顶层字段，§2.2 部分参数标注 O（可选）；§2.3 给出 12 个动作码；示例 response.txt 只示范 roleCommandMap，且含重复角色键（接口文档注明那只是动作目录写法）"
      refs: [api_doc, response_sample]
    local:
      behavior: "ResponseBuilder 在 prompt/executeCmd 为空时**完全省略**字段，只保留 roleCommandMap；动作码与字段名按接口文档枚举构造，未做本地改写"
      code: "sandbox.ResponseBuilder.build；protocol.*_command 构造器"
    question: "真实回执的最小必需形状是什么：roleCommandMap 能否为空对象、prompt/executeCmd 省略是否合法、未知动作码或空字符串如何判？"
    evidence_needed: "官方一次'无动作/无任务'回合的完整回执样本（可作空值基线），以及判题器对非法动作码的 errors[] 对照"
    confirmation: null

  - id: V-006
    title: 已知的互换位置规则 vs 本地结算实现
    priority: P0
    category: implementation_gap
    status: needs_trace
    official:
      requirement: "任务书 §4.5.4 第5点：③位置互换（两名角色预期互相移动到对方当前位置）触发碰撞；碰撞结果：双方均中断移动，停留在碰撞前位置"
