name: 内网实机反馈
description: 描述现象并贴日志；版本和原因由我们一起核对
title: "[内网测试] "
body:
  - type: markdown
    attributes:
      value: "写一下遇到了什么，附可公开的日志或截图即可。无需先定位原因或填写规则编号。版本优先从日志 identity 行读取；不要上传凭据或未获允许的数据。"
  - type: input
    id: commit
    attributes:
      label: 版本（可选）
      description: 有启动 identity 日志可以不填；也可填写 git rev-parse HEAD 或参赛包名称
  - type: input
    id: environment
    attributes:
      label: 地图或场景（可选）
      description: 例如 attack_map；不知道可以留空
  - type: textarea
    id: reproduction
    attributes:
      label: 现象与日志
      description: 用一句话说明发生了什么，然后粘贴或拖入可公开的日志/截图。不用整理最小复现，启动 identity 和 task_event 行会帮助我们定位。
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: 数据范围
      options:
        - label: 我确认以上信息已脱敏并允许公开，附件不含公司凭据或未获允许的数据。
          required: true
