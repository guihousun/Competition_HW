[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coregeek-futurewar"
version = "0.1.0"
description = "华为云核心网第十届编程大赛《未来战争》参赛 Agent"
# 判题环境只有标准库（无 cryptography / numpy / pytest / yaml），
# 因此 dependencies 必须保持为空，且语法不得超出 3.11。
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
